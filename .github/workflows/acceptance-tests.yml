name: Acceptance Tests

# Controls when the workflow will run
on:
  push:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  acceptance-tests:
    name: Acceptance Tests - Java ${{ matrix.java }} - Maven ${{ matrix.maven }} - ${{ matrix.auth }}
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        java: ['21']
        maven: ['3.9.0', '3.9.11']
        # oauth2.0: access key id/secret, oauth2.1-jwk: OAuth 2.1 private_key_jwt
        auth: ['oauth2.0', 'oauth2.1-jwk']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Maven ${{ matrix.maven }}
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: ${{ matrix.maven }}

      - name: Verify Java and Maven versions
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version

      - name: Build artifact wagon
        run: mvn clean install

      - name: Configure HERE credentials (OAuth 2.0)
        if: matrix.auth == 'oauth2.0'
        env:
          OLP_CREDENTIALS: ${{ secrets.OLP_CREDENTIALS }}
        run: mkdir -p ~/.here/ && echo $OLP_CREDENTIALS | base64 --decode > ~/.here/credentials.properties

      # the default ~/.here/credentials.properties is intentionally not created, so the build can only
      # authenticate with the JWK credentials
      - name: Configure HERE credentials (OAuth 2.1 private_key_jwt)
        if: matrix.auth == 'oauth2.1-jwk'
        env:
          OLP_JWK_CREDENTIALS: ${{ secrets.OLP_JWK_CREDENTIALS }}
          OLP_JWK_PRIVATE_KEY: ${{ secrets.OLP_JWK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$OLP_JWK_CREDENTIALS" ] || [ -z "$OLP_JWK_PRIVATE_KEY" ]; then
            echo "::error::OLP_JWK_CREDENTIALS and OLP_JWK_PRIVATE_KEY secrets are required"
            exit 1
          fi
          if [ -e ~/.here/credentials.properties ]; then
            echo "::error::~/.here/credentials.properties must not exist for the JWK acceptance tests"
            exit 1
          fi
          umask 077
          dir="$RUNNER_TEMP/here"
          mkdir -p "$dir"
          printf '%s\n' "$OLP_JWK_PRIVATE_KEY" > "$dir/private-key.pem"
          echo "$OLP_JWK_CREDENTIALS" | base64 --decode > "$dir/credentials-jwk.properties"
          printf '\nhere.private.key=%s\n' "$dir/private-key.pem" >> "$dir/credentials-jwk.properties"
          if ! grep -Eq '^[[:space:]]*here\.auth\.method[[:space:]]*=[[:space:]]*private_key_jwt[[:space:]]*$' "$dir/credentials-jwk.properties"; then
            echo "::error::OLP_JWK_CREDENTIALS must contain here.auth.method=private_key_jwt"
            exit 1
          fi
          echo "HERE_CREDENTIALS_FILE=$dir/credentials-jwk.properties" >> "$GITHUB_ENV"

      - name: Run acceptance tests
        run: mvn clean test -Pacceptance-tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports-java${{ matrix.java }}-maven${{ matrix.maven }}-${{ matrix.auth }}
          path: target/cucumber-reports/
          retention-days: 30

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}-maven${{ matrix.maven }}-${{ matrix.auth }}
          path: target/surefire-reports/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            target/cucumber-reports/cucumber.xml
            target/surefire-reports/*.xml
          check_name: Test Results - Java ${{ matrix.java }} - Maven ${{ matrix.maven }} - ${{ matrix.auth }}

  acceptance-tests-summary:
    name: Acceptance Tests Summary
    needs: acceptance-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.acceptance-tests.result }}" = "success" ]; then
            echo "All acceptance tests passed!"
          else
            echo "Some acceptance tests failed"
            exit 1
          fi

